<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leaflet JS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        #map {
            width: 100%;
            height: 700px;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Inisialisasi peta
        var map = L.map("map").setView([-8.4900, 119.8780], 13);

        // Tile Layer Base Map
        var osm = L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '&copy; OpenStreetMap France | &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });

        // Google Satellite
        var Google_Satellite = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: 'Map data &copy; Google'
        });

        // Google Terrain
        var Google_Terrain = L.tileLayer('https://{s}.google.com/vt/lyrs=p&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
            attribution: 'Map data &copy; Google'
        });

        var Esri_WorldImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Tiles &copy; Esri &mdash; Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP, and the GIS User Community'
        });

        var rupabumiindonesia = L.tileLayer('https://geoservices.big.go.id/rbi/rest/services/BASEMAP/Rupabumi_Indonesia/MapServer/tile/{z}/{y}/{x}', {
            attribution: 'Badan Informasi Geospasial'
        });

        var OpenStreetMap_Mapnik = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });

        // Menambahkan basemap ke dalam peta
        Esri_WorldImagery.addTo(map);

        // Marker
        var marker = L.marker([-8.4899433, 119.8764610]);
        var marker2 = L.marker([-8.4886684, 119.8661613])


        // Menambahkan marker ke dalam peta
        marker.addTo(map);
        marker2.addTo(map)

        // Popup
        marker.bindPopup("<b>Labuan Bajo</b><br>Labuan Bajo adalah sebuah kota pelabuhan di ujung barat Pulau Flores, Nusa Tenggara Timur, yang menjadi pintu gerbang utama menuju Taman Nasional Komodo");
        //marker.openPopup();

        marker2.bindPopup("<b>Pulau Bajo</b><br>Pulau Bajo adalah sebuah pulau kecil yang terletak sangat dekat dengan daratan Labuan Bajo, Manggarai Barat, Nusa Tenggara Timur. Pulau dengan luas sekitar 73,49 hektare ini hanya berjarak 200 meter dari pesisir Flores dan bisa dicapai dalam waktu 10 menit menggunakan perahu kayu")

        // Tooltip
        marker.bindTooltip("Labuan Bajo");
        marker2.bindTooltip("Pulau Bajo");
        //marker.openTooltip();

        // Circle
        var circle = L.circle([-8.4937184, 119.8760748], {
            color: "yellow", // warna garis
            opacity: 1, // opacity garis
            fillColor: "yellow", // warna fill
            fillOpacity: 0.5, // opacity fill
            radius: 300, // radius dalam meter
        });

        // Menambahkan circle ke dalam peta
        circle.addTo(map);

        // Popup
        circle.bindTooltip("<b>Hallo</b><br>Ini circle", {sticky: true});
        //circle.openPopup();

        // Polyline
        var vertexPolyline = [
            [-8.4899433, 119.8764610],
            [-8.4886684, 119.8661613],
            [-8.4937184, 119.8760748],
            [-8.4899433, 119.8764610]
        ];
        var polyline = L.polyline(vertexPolyline, {
            color: "red", // warna garis
            weight: 5, // ketebalan garis
            opacity: 1, // opacity garis
        });

        // Menambahkan polyline ke dalam peta
        polyline.addTo(map);

        //Popup
        polyline.bindPopup("<b>Hallo</b><br>Ini popup polyline");
        //polyline.openPopup();

        // Tooltip
        polyline.bindTooltip("Ini tooltip polyline", {sticky: true});
        //polyline.openTooltip();

        // Polygon
        var vertexPolygon = [
            [-8.4866902, 119.8643589],
            [-8.4854798, 119.8660541],
            [-8.4866902, 119.8668265],
            [-8.4874546, 119.8654318],
            [-8.4877094, 119.8638010]
        ];
        var polygon = L.polygon(vertexPolygon, {
            color: "purple", // warna garis
            weight: 3, // ketebalan garis
            opacity: 1, // opacity garis
            fillColor: "lightgreen", // warna fill
            fillOpacity: 0.5, // opacity fill
        });

        // Menambahkan polygon ke dalam peta
        polygon.addTo(map);

        // Popup
        polygon.bindPopup("<b>Hallo</b><br>Ini adalah popup polygon");
        //polygon.openPopup();

        // Tooltip
        polygon.bindTooltip("Ini adalah tooltip polygon", {sticky: true});
        //polygon.openTooltip();

        // Control Layer
        var baseMaps = {
            "OpenStreetMap": osm,
            "Esri World Imagery": Esri_WorldImagery,
            "Rupa Bumi Indonesia": rupabumiindonesia,
            "Google Terrain": Google_Terrain,
            "Google Satelit": Google_Satellite
        };

        var overlayMaps = {
            "Labuan Bajo": marker,
            "Pulau Bajo": marker2,
            "Circle": circle,
            "Line": polyline,
            "Polygon": polygon

        };

        var controllayer = L.control.layers(baseMaps, overlayMaps);
        controllayer.addTo(map);

        // Scale
        var scale = L.control.scale({
            position: "bottomright",

        });
        scale.addTo(map);

        // Geolocation
        map.locate({
            setView: true,
            maxZoom: 16,
        });

        // Fungsi untuk menampilkan lokasi
        function onLocationFound(e) {
            var radius = e.accuracy / 2;

            // Menampilkan marker pada lokasi 
            L.marker(e.latlng).addTo(map).bindPopup("Anda berada dalam radius " + radius + " meter dari titik ini").openPopup();

            // Menampilkan circle pada lokasi
            L.circle(e.latlng, radius).addTo(map);
        }

        map.on("locationfound", onLocationFound);

        // Fungsi untuk menampilkan pesan error
        function onLocationError(e) {
            alert(e.message);
        }

        map.on("locationerror", onLocationError);

    </script>
</body>

</html>
